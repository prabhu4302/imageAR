<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Image Text Reader</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    #output { white-space: pre-wrap; background: #f0f0f0; padding: 10px; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Image Text Reader</h1>
  <input type="file" id="imageInput" accept="image/*" />
  <p><button onclick="analyzeImage()">Read Text</button></p>
  <div id="output">Extracted text will appear here...</div>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <script>
    let image;

    document.getElementById("imageInput").addEventListener("change", function(e) {
      image = e.target.files[0];
    });

    function analyzeImage() {
      if (!image) {
        alert("Please select an image first.");
        return;
      }

      Tesseract.recognize(
        image,
        'eng',
        {
          logger: m => console.log(m)
        }
      ).then(({ data: { text } }) => {
        document.getElementById("output").textContent = text;
      }).catch(err => {
        console.error(err);
        document.getElementById("output").textContent = "Error analyzing image.";
      });
    }
  </script>
</body>
</html>
